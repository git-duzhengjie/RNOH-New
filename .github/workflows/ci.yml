# RNOH-New: 持续集成工作流
#
# 触发条件：push 到任意分支、或创建/更新 Pull Request
# 流程：checkout → setup-node → npm ci → lint → typecheck → node 语法检查

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 若存在 lint 脚本则执行（不存在时跳过）
      - name: Run lint (if available)
        run: |
          if npm run lint --if-present; then
            echo "✅ Lint passed"
          fi

      # 分类型检查：逐个使用各包自己的 tsconfig（根节点为共享基座配置，不直接编译）
      - name: Run typecheck (per-package tsconfig)
        run: |
          found=0
          for tsconfig in $(find . -maxdepth 4 -name "tsconfig.json" \
            -not -path "./node_modules/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/oh_modules/*" \
            -not -path "*/build/*" \
            -not -path "*/dist/*" \
            | sort); do
            echo "▶ typecheck: $tsconfig"
            # 跳过根节点的基座配置（files 为空，仅用于共享 compilerOptions）
            if grep -q '"files"[[:space:]]*:[[:space:]]*\[\]' "$tsconfig"; then
              echo "  ⏭  基座配置（files 为空），跳过"
              continue
            fi
            npx tsc -p "$tsconfig" --noEmit || exit 1
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "ℹ️  No tsconfig.json found, skipping typecheck"
          else
            echo "✅ Typecheck passed for $found tsconfig(s)"
          fi

      # 对仓库内所有 .js / .mjs / .cjs 文件做语法检查
      - name: Node syntax check
        run: |
          find . -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.cjs" \) \
            -not -path "./node_modules/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/oh_modules/*" \
            -not -path "*/build/*" \
            -not -path "*/dist/*" \
            -not -path "*/.hvigor/*" \
            -not -path "*/.cxx/*" \
            -not -path "*/.git/*" \
            -not -path "*/third-party/*" \
            -not -path "*/legacy/*" \
            | sort > /tmp/js-files.txt
          echo "ℹ️  待检查 JS 文件数: $(wc -l < /tmp/js-files.txt)"
          failed=0
          while IFS= read -r f; do
            # 先按 CommonJS 解析，失败再按 ESM 解析（兼容顶层 await / import 语法）
            if node -c "$f" 2>/dev/null; then
              continue
            fi
            if node --input-type=module --check < "$f" 2>/dev/null; then
              continue
            fi
            echo "❌ $f"
            # 打印诊断信息（避免因 set -e 直接中断，丢失后续文件结果）
            { node -c "$f" 2>&1 | head -n 5; } || true
            failed=$((failed + 1))
          done < /tmp/js-files.txt
          if [ "$failed" -gt 0 ]; then
            echo "❌ Syntax errors in $failed file(s)"
            exit 1
          fi
          echo "✅ Node syntax check passed"
